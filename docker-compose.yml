services:
  postgres:
    image: postgres:16-alpine
    container_name: chatgpt2api-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=chatgpt2api
      - POSTGRES_USER=chatgpt2api
      - POSTGRES_PASSWORD=chatgpt2api_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatgpt2api -d chatgpt2api"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatgpt2api-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/basketikun/chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - STORAGE_BACKEND=${STORAGE_BACKEND:-postgres}
      - DATABASE_URL=${DATABASE_URL:-postgresql://chatgpt2api:chatgpt2api_password@postgres:5432/chatgpt2api}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - UVICORN_WORKERS=${UVICORN_WORKERS:-6}
      - APP_THREADPOOL_TOKENS=${APP_THREADPOOL_TOKENS:-100}
      - APP_THREAD_STACK_SIZE_KB=${APP_THREAD_STACK_SIZE_KB:-1024}
      - APP_MEMORY_TRIM_ENABLED=${APP_MEMORY_TRIM_ENABLED:-true}
      - APP_MEMORY_TRIM_INTERVAL_SECS=${APP_MEMORY_TRIM_INTERVAL_SECS:-30}
      - APP_MEMORY_DIAG_ENABLED=${APP_MEMORY_DIAG_ENABLED:-false}
      - APP_MEMORY_DIAG_INTERVAL_SECS=${APP_MEMORY_DIAG_INTERVAL_SECS:-60}
      - APP_MEMORY_DIAG_OUTPUT=${APP_MEMORY_DIAG_OUTPUT:-/app/data/memory_diagnostics.jsonl}
      - APP_MEMORY_RECYCLE_ENABLED=${APP_MEMORY_RECYCLE_ENABLED:-false}
      - APP_MEMORY_RECYCLE_RSS_MB=${APP_MEMORY_RECYCLE_RSS_MB:-1024}
      - APP_MEMORY_RECYCLE_IDLE_SECS=${APP_MEMORY_RECYCLE_IDLE_SECS:-300}
      - APP_MEMORY_RECYCLE_INTERVAL_SECS=${APP_MEMORY_RECYCLE_INTERVAL_SECS:-30}
      - APP_MEMORY_RECYCLE_MIN_AGE_SECS=${APP_MEMORY_RECYCLE_MIN_AGE_SECS:-300}
      - APP_MEMORY_RECYCLE_REQUIRE_GLOBAL_IDLE=${APP_MEMORY_RECYCLE_REQUIRE_GLOBAL_IDLE:-false}
      # - CHATGPT2API_AUTH_KEY=your_secret_key
      # - CHATGPT2API_BASE_URL=https://your-domain.com

volumes:
  postgres_data:
